

services:
  postgres:
    image: postgres:16
    container_name: rozgaar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rozgaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rozgaar}
      POSTGRES_DB: ${POSTGRES_DB:-rozgaar}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rozgaar} -d $${POSTGRES_DB:-rozgaar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: rozgaar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.15
    container_name: rozgaar-chroma
    environment:
      CHROMA_HOST_ADDR: 0.0.0.0
      CHROMA_HOST_PORT: 8000
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: rozgaar-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rozgaar-api
    env_file:
      - .env
    environment:
      JWT_PRIVATE_KEY_FILE: /app/private_key.pem
      JWT_PUBLIC_KEY_FILE: /app/public_key.pem
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rozgaar-worker
    env_file:
      - .env
    environment:
      JWT_PRIVATE_KEY_FILE: /app/private_key.pem
      JWT_PUBLIC_KEY_FILE: /app/public_key.pem
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "agents,scrapers"]
    volumes:
      - ./:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rozgaar-beat
    env_file:
      - .env
    environment:
      JWT_PRIVATE_KEY_FILE: /app/private_key.pem
      JWT_PUBLIC_KEY_FILE: /app/public_key.pem
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rozgaar-ui
    env_file:
      - .env
    environment:
      PUBLIC_API_URL: http://api:8000
      PUBLIC_API_DISPLAY_URL: http://localhost:8000
      JWT_PRIVATE_KEY_FILE: /app/private_key.pem
      JWT_PUBLIC_KEY_FILE: /app/public_key.pem
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
